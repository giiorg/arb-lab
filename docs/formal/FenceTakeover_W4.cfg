\* CONTROL-WITNESS PROBE W4 -- does NC4's counterexample show the HARM?
\*
\* NC4 reproduces FM-1, the finding THIS MODEL discovered, so what its
\* witness demonstrates matters more than most. The good news first: the
\* 11-state trace traverses FM-1's mechanism exactly -- ActMarkFlat records
\* the durable flat evidence, ActCrash opens the window, OpClearIncident
\* clears inside it, BotEntrySubmit re-admits under the still-Active plan,
\* ActDeactivate re-drives the stale tombstone. The route is right.
\*
\* Then it stops one step early. The re-admitted entry never fills, so the
\* final state is `pos = "flat"`, `hadExposure = FALSE`, and I3 fires on
\* `NoLiveOrders`. FM-1's stated cost is that the stale tombstone "kills
\* host-independent coverage UNDER LIVE EXPOSURE" -- and live exposure is
\* the one thing the witness does not have.
\*
\* This asks for the fill: exposure open on a trade whose ActuatedFlat
\* evidence is already durably recorded. That is FM-1's harm, and nothing
\* in the suite has shown it.
