\* CONTROL-WITNESS PROBE W5 -- does NC21's counterexample show the HARM?
\*
\* NC21's trace advances the generation by SUBMITTING ITS PERP LEG one step
\* after the premise dissolved. That is the cheapest advance in the ladder,
\* and slice E established that the cheap surrogate is what breadth-first
\* search returns -- systematically, not by accident. A perp buy over a short
\* package is not self-evidently the harm.
\*
\* NC21's constants exactly (PREMISE_IS_STANDING = FALSE), asking for the
\* SECOND leg instead: real spot authorized and sent on the dissolved
\* premise. A VIOLATION is the good result -- it says the pre-ruling world
\* reaches the money harm and not merely a flag.
\*
\* SPECIFICATION Spec, not LiveSpec: a REACHABILITY question.
