\* NEGATIVE CONTROL NC8 -- the reserved spot leg sized from the generation's
\* TARGET rather than from the CONFIRMED perp reduction.
\* EXPECTED: INV5_PackageDeleverNeverNetShort VIOLATED -- a partially
\* confirmed perp reduction followed by a full-size spot sale takes the
\* transient net-SHORT, which SM SS7 says it must never be, in the rally that
\* triggered the generation.
\*
\* Detectable ONLY where the perp confirmation can fall short of the target.
\* Probe PC18 is what proves that state is reached -- without it "capped by
\* the confirmed reduction" and "capped by the target" are the same
\* expression and this flip would be invisible.
SPECIFICATION Spec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = FALSE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  \* SLICE C liveness controls, at their nominal values (NC13-NC16 flip one
  \* each). None is read by a guard a safety invariant can see.
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
  RECLASSIFY_ON_LEDGER_CHANGE = TRUE
  \* SLICE F -- FM-8's standing precondition and the quantity it reads.
  PREMISE_IS_STANDING       = TRUE
  PREMISE_NETS_OWN_LEGS     = TRUE
  PREMISE_SUPERSESSION_FAIR = TRUE
INVARIANTS
  TypeOK
  INV5_PackageDeleverNeverNetShort
