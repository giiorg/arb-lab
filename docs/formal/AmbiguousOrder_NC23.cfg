\* NEGATIVE CONTROL NC23 -- and it is a control on THIS SLICE'S OWN FIRST
\* ANSWER, kept as a run rather than as a war story.
\*
\* PREMISE_SUPERSESSION_FAIR = FALSE removes exactly one conjunct from the
\* fairness set: the premise-lost supersession. Nothing else changes -- same
\* constants, same state graph, only the behaviours differ -- so what this
\* demonstrates is attributable to the fairness and not to a state change.
\*
\* EXPECTED: P5_HeldPerpGenerationResumes VIOLATED, with a behaviour that
\* STUTTERS while a generation is alive on a premise that has dissolved.
\*
\* WHY IT EXISTS. The first slice-F encoding left this row OUT of the
\* fairness set, with a recorded reason: that adding it would hand P3/P5 an
\* exit their own premises do not contain. The nominal liveness config
\* refuted that -- a generation halted at `PerpReduceFinal` after a
\* reduction's own ambiguous result released its ledger entry (FM-8's exact
\* scenario), the dispatch budget spent so SS2 could not compensate either,
\* and the one action that could end it available and never taken.
\*
\* Without this config that refutation is a session anecdote: a later reader
\* tidying the fairness set would find a reasoned comment and no objection.
\* That is FM-7's lesson -- NOBODY RE-DERIVES A RECORDED JUSTIFICATION --
\* applied to a mistake this slice made itself.
\*
\* The distinction it pins is the one the wrong argument missed:
\* `EmergencyClosePackage` and `FenceReadyLost` are EXTERNAL ARBITRATION
\* EVENTS and are correctly unfair, because nothing here decides when they
\* fire. The premise-lost row is a MACHINE OBLIGATION TRIGGERED BY STATE --
\* which is why it carries its own guard in `Next` while the other two are
\* enabled unconditionally -- and SM SS7's verb is "supersedes", not "may
\* supersede". A standing obligation nothing is obliged to discharge is not
\* a standing obligation.
\*
\* ONE property listed, per the NC5 attribution rule: `failprop` cannot name
\* which temporal property TLC violated.
