\* NEGATIVE CONTROL NC14 -- P2. RECLASSIFY_AFTER_DEADLINE = FALSE: the
\* machine latches the DeadlineExceededAmbiguous verdict and stops
\* re-classifying for the rest of the episode, so SM SS2's late-resolution
\* transition (row 6 back to row 2) never fires. The intervals collapse, the
\* residual becomes exactly knowable, and the machine goes on treating it as
\* deadline-exceeded -- permanently in the branch whose ONLY admissible
\* action is one interval floor it has already issued.
\*
\* Why this control exists when NC13 also fails P2: NC13 removes the
\* finality edge for every verdict, which is the wholesale defect. This one
\* removes ONLY the way back out of DeadlineExceeded and leaves ordinary
\* classification working, so it fails P2 while P1 still holds -- P1's
\* consequent admits DeadlineExceeded, which this machine reaches. It is
\* the isolating control, and the difference between the two is the
\* difference between "classification stopped" and "this episode is
\* terminal", which is exactly the reading SS2's row 6 forbids.
\*
\* CHECK_DEADLOCK FALSE: the latched episode strands the machine once its
\* one floor is issued -- see NC13's note, same reason.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = FALSE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
INVARIANTS
  TypeOK
PROPERTIES
  P2_DeadlineExceededResolves
