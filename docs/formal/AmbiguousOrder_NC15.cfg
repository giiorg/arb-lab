\* NEGATIVE CONTROL NC15 -- P3. HELD_RESUMES = FALSE: SM SS7 FLAG-4's ruling
\* that `Held/Alert` is NONTERMINAL is removed, so eventual finality of the
\* held leg no longer resumes the generation. The park's only remaining exit
\* is TerminalFlatten, which is a POLICY branch ("if completion is
\* impossible or the imminence branch fires") and therefore unfair -- so a
\* generation may sit held with its reserved spot leg outstanding forever,
\* which is the reading FLAG-4 was written to rule out.
\*
\* Note what the control does NOT do: it does not remove the state's
\* successors. PdTerminalFlatten stays enabled throughout, so nothing is
\* stranded and CHECK_DEADLOCK stays ON here -- the defect reports as a
\* temporal violation, which is what it is, rather than as a deadlock, which
\* would be TLC objecting to the shape of the control instead of to the
\* behaviour. The distinction matters: run.sh reads the deadlock and the
\* temporal violation differently, and only one of them names P3.
SPECIFICATION LiveSpec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = FALSE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
  RECLASSIFY_ON_LEDGER_CHANGE = TRUE
INVARIANTS
  TypeOK
PROPERTIES
  P3_HeldGenerationResumes
