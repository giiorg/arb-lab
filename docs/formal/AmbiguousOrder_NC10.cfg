\* NEGATIVE CONTROL NC10 -- a superseding path (EmergencyClosePackage or the
\* FenceReadyLost arbitration) ends the generation WITHOUT quiescing its
\* reserved second leg to SS6.7 finality first.
\* EXPECTED: INV6_SupersessionQuiescesFirst VIOLATED.
\*
\* The flag INV6 reads is written unconditionally from the state at the
\* supersession, so removing the guard SETS it rather than hiding the event
\* -- the RecordDispatch shape, one machine out.
SPECIFICATION Spec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = FALSE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  \* SLICE C liveness controls, at their nominal values (NC13-NC16 flip one
  \* each). None is read by a guard a safety invariant can see.
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
INVARIANTS
  TypeOK
  INV6_SupersessionQuiescesFirst
