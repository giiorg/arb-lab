\* NEGATIVE CONTROL NC6 -- the determined branch sized from the realized
\* delta ALONE, with outstanding_reserved_reductions not subtracted.
\* EXPECTED: INV1_NeverOvershootSign VIOLATED -- an already-reserved
\* generation is re-read as fresh naked residual and compensated a second
\* time, so the pair over-reduces past zero.
\*
\* This is the run that exercises SS46 SS2.1's composition surface: the ONE
\* subtraction that three producers will rest on in slice B. It is also why
\* NPEND = 2 -- with a single generation slot the subtrahend is pinned to
\* zero and this flip would be undetectable.
SPECIFICATION Spec
CONSTANTS
  NORD                    = 3
  MAXQ                    = 2
  NPEND                    = 3
  MAX_DISPATCH            = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO      = TRUE
  FLOOR_ONCE              = TRUE
  STRADDLE_GUARD          = TRUE
  BLIND_COMPENSATION      = FALSE
  CLASSIFY_ON_FILLS_ONLY  = FALSE
  RESERVATION_AWARE_SIZING = FALSE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  \* SLICE C liveness controls, at their nominal values (NC13-NC16 flip one
  \* each). None is read by a guard a safety invariant can see.
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
  RECLASSIFY_ON_LEDGER_CHANGE = TRUE
  \* SLICE F -- FM-8's standing precondition and the quantity it reads.
  PREMISE_IS_STANDING       = TRUE
  PREMISE_NETS_OWN_LEGS     = TRUE
  PREMISE_SUPERSESSION_FAIR = TRUE
INVARIANTS
  TypeOK
  INV1_NeverOvershootSign
