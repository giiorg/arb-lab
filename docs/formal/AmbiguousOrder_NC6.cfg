\* NEGATIVE CONTROL NC6 -- the determined branch sized from the realized
\* delta ALONE, with outstanding_reserved_reductions not subtracted.
\* EXPECTED: INV1_NeverOvershootSign VIOLATED -- an already-reserved
\* generation is re-read as fresh naked residual and compensated a second
\* time, so the pair over-reduces past zero.
\*
\* This is the run that exercises SS46 SS2.1's composition surface: the ONE
\* subtraction that three producers will rest on in slice B. It is also why
\* NPEND = 2 -- with a single generation slot the subtrahend is pinned to
\* zero and this flip would be undetectable.
SPECIFICATION Spec
CONSTANTS
  NORD                    = 3
  MAXQ                    = 2
  NPEND                   = 2
  MAX_DISPATCH            = 3
  FLOOR_NEAREST_ZERO      = TRUE
  FLOOR_ONCE              = TRUE
  STRADDLE_GUARD          = TRUE
  BLIND_COMPENSATION      = FALSE
  CLASSIFY_ON_FILLS_ONLY  = FALSE
  RESERVATION_AWARE_SIZING = FALSE
INVARIANTS
  TypeOK
  INV1_NeverOvershootSign
