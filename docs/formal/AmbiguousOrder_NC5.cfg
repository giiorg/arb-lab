\* NEGATIVE CONTROL NC5 -- the straddle test removed from the interval
\* floor, so it fires when the summed interval straddles zero (a < 0 < b),
\* where SM SS2 row 6 permits de-minimis only. EXPECTED:
\* INV3_NoUncertainCompensation VIOLATED. A second, mechanically distinct
\* control on INV3 (NC3 breaks the ambiguous-window clause; this one breaks
\* the straddle clause), because the two clauses are separately
\* load-bearing and a control on one says nothing about the other.
SPECIFICATION Spec
CONSTANTS
  NORD                    = 3
  MAXQ                    = 2
  NPEND                   = 2
  MAX_DISPATCH            = 3
  FLOOR_NEAREST_ZERO      = TRUE
  FLOOR_ONCE              = TRUE
  STRADDLE_GUARD          = FALSE
  BLIND_COMPENSATION      = FALSE
  CLASSIFY_ON_FILLS_ONLY  = FALSE
  RESERVATION_AWARE_SIZING = TRUE
INVARIANTS
  TypeOK
  INV3_NoUncertainCompensation
