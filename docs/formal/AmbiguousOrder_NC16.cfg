\* NEGATIVE CONTROL NC16 -- P4. BLIND_RETRY = TRUE: on a reduction whose own
\* result comes back ambiguous, the machine RE-SENDS it on its own authority
\* instead of routing it through the SS6.7 finality contract -- the exact
\* behaviour SM SS2 row 4 forbids ("it never blind-retries, and its own
\* ambiguous result ... routes through this same SS6.7 finality contract").
\* The generation cycles result-ambiguous -> re-send -> result-ambiguous and
\* its reservation never leaves the ledger, so `realized - reserved` keeps
\* subtracting a reduction that is never going to land.
\*
\* Two things about this control are load-bearing and neither is decoration:
\*
\*  - The retry spends NO dispatch budget. Charged to MAX_DISPATCH, the
\*    model's own bound would terminate the loop and P4 would pass with the
\*    defect installed -- SS46 SS8g's budget trap pointing the other way.
\*  - The ambiguity is a STATE (`pending[k].amb`), not an edge. A re-send
\*    that leaves `vars` unchanged is a stuttering step, and weak fairness
\*    steps straight over stutter: WF_vars(ReductionFills \/
\*    ReductionAmbiguous) would force the fill and the loop would never
\*    form. With the bit, both nominal exits are disabled in the `amb`
\*    state, the fairness premise (CONTINUOUS enabledness) fails, and the
\*    retry loop is a genuine fair lasso.
\*
\* CHECK_DEADLOCK stays ON: ReductionBlindRetry is always enabled from the
\* `amb` state, so nothing is stranded.
SPECIFICATION LiveSpec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = TRUE
INVARIANTS
  TypeOK
PROPERTIES
  P4_FloorGenerationResolves
