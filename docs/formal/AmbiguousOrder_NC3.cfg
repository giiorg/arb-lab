\* NEGATIVE CONTROL NC3 -- the classification stops gating the compensating
\* trade, so the RAW DELTA does: a reduction is dispatched on the observed
\* residual while counter-leg orders still have remaining executable
\* quantity. EXPECTED: INV3_NoUncertainCompensation VIOLATED. This is the
\* wrong implementation SM SS2 names by hand ("sell the filled spot against
\* a perp only partially filled ... the remaining 0.6 fills -> naked
\* short"). INV1 also falls under this flip; only INV3 is listed so the
\* attribution is unambiguous.
SPECIFICATION Spec
CONSTANTS
  NORD                    = 3
  MAXQ                    = 2
  NPEND                    = 3
  MAX_DISPATCH            = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO      = TRUE
  FLOOR_ONCE              = TRUE
  STRADDLE_GUARD          = TRUE
  BLIND_COMPENSATION      = TRUE
  CLASSIFY_ON_FILLS_ONLY  = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  \* SLICE C liveness controls, at their nominal values (NC13-NC16 flip one
  \* each). None is read by a guard a safety invariant can see.
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
  RECLASSIFY_ON_LEDGER_CHANGE = TRUE
  \* SLICE F -- FM-8's standing precondition and the quantity it reads.
  PREMISE_IS_STANDING       = TRUE
  PREMISE_NETS_OWN_LEGS     = TRUE
  PREMISE_SUPERSESSION_FAIR = TRUE
INVARIANTS
  TypeOK
  INV3_NoUncertainCompensation
