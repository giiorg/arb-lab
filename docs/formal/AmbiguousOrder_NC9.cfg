\* NEGATIVE CONTROL NC9 -- the reserved spot leg authorized WITHOUT waiting
\* for the perp reduction's finality (SM SS7's perp-short-FIRST sequencing).
\* EXPECTED: INV5_PackageDeleverNeverNetShort VIOLATED -- spot sold with
\* nothing confirmed bought.
\*
\* Note this is not a second knob on the same number: an authorization taken
\* before finality has no confirmed quantity in existence, so the target is
\* all there is to size from. NC9 removes the CONFIRMATION; sizing from the
\* target is what its absence leaves behind, not an extra defect stacked on
\* it (see SpotCap).
SPECIFICATION Spec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = FALSE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  \* SLICE C liveness controls, at their nominal values (NC13-NC16 flip one
  \* each). None is read by a guard a safety invariant can see.
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
  RECLASSIFY_ON_LEDGER_CHANGE = TRUE
INVARIANTS
  TypeOK
  INV5_PackageDeleverNeverNetShort
