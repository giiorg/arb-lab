\* NEGATIVE CONTROL NC7 -- SM SS7 FLAG-3 read LITERALLY: the generation's
\* reservation is booked AT CREATION carrying its TARGET, before the perp
\* leg has confirmed anything.
\* EXPECTED: INV4_ReservationLedgerSound VIOLATED -- an intention booked
\* against delta the generation has not moved.
\*
\* THIS IS FM-5. It is a negative control here because the nominal reading
\* is the sound one (the entry exists from creation, as FLAG-3 requires, but
\* carries the generation's OUTSTANDING NET INTENT, which is zero until the
\* perp leg confirms). The harm the trace shows, one step past the invariant:
\* on a package that is neutral, `realized - reserved` reports a SHORT, and
\* SS2's determined branch buys back exactly the exposure the generation is
\* about to buy itself. See SS46 SS8d.
SPECIFICATION Spec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = TRUE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  \* SLICE C liveness controls, at their nominal values (NC13-NC16 flip one
  \* each). None is read by a guard a safety invariant can see.
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
