\* NEGATIVE CONTROL NC5 [-> FM-4]: ARBITRATION_SNAPSHOT = FALSE restores the
\* pre-FM-4 branch guards, which re-read LIVE health. A loss that repairs
\* before its branch fires then disables all three at once -- branch 1 needs
\* a live failed dimension, branches 2/3 need live signing loss -- and the
\* incident strands in un-arbitrated FenceReadyLost with exposure open, the
\* bot alive but barred from opening, and no automated exit.
\*
\* This config exists to prove P4_ArbitrationCompletes BITES. A liveness
\* property that has never been observed to fail is decoration, not
\* evidence -- the lesson of Cx7-2 (a property vacuous for branch 1 for a
\* whole round) and of this round (a completion path with no capability
\* property over it). P4 is the ONLY property listed, so the reported
\* temporal violation is unambiguously attributable to it.
SPECIFICATION LiveSpec2
CONSTANTS
  DURABLE_LATCH      = TRUE
  EVIDENCE_GATED     = TRUE
  CANARY_UNFENCED    = FALSE
  TRADE_TERMINALITY  = TRUE
  OPERATOR_INTERVENES = FALSE
  ARBITRATION_SNAPSHOT = FALSE
  MAX_CLOSE_ATTEMPTS = 2
  BOUND_CRASHES      = TRUE
  CRASH_BUDGET       = 2
INVARIANTS
  TypeOK
PROPERTIES
  P4_ArbitrationCompletes
