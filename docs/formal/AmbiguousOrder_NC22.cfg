\* NEGATIVE CONTROL NC22 -- and note what it is a control ON. Not a defect
\* somebody might implement: THE LITERAL READING OF THE LANDED SPEC
\* SENTENCE. SM SS7's third supersession row (v0.9.25) says the trigger is
\* "the SS2 classifier leaves `Determined` for this hedge group", and
\* PREMISE_NETS_OWN_LEGS = FALSE evaluates exactly that -- `cls #
\* "Determined"`, the classifier's actual verdict.
\*
\* EXPECTED: INV10_PremiseSupersessionOnlyOnRealLoss VIOLATED -- the row
\* fires on a generation whose premise is INTACT.
\*
\* Why, and why it is the spec's problem rather than the model's: the
\* generation's own perp reduction IS an exposure-changing order on the hedge
\* group. PdSubmitPerp reclassifies with the leg's interval in the sum, so
\* `cls` leaves "Determined" on the generation's FIRST STEP -- and SS7
\* depends on that (it is how SS2 refuses every compensating trade until the
\* leg reaches finality). The literal trigger therefore reports the
\* generation's own machinery back to it as a dissolved premise.
\*
\* The cost of a spurious fire is not bookkeeping. SS7's generations exist
\* because the perp short is nearing liquidation; aborting one cancels the
\* mechanism that was reducing that risk, and does it while a reserved leg
\* is out.
SPECIFICATION Spec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  \* SLICE C liveness controls, at their nominal values (NC13-NC16 flip one
  \* each). None is read by a guard a safety invariant can see.
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
  RECLASSIFY_ON_LEDGER_CHANGE = TRUE
  \* SLICE F -- FM-8's standing precondition and the quantity it reads.
  PREMISE_IS_STANDING       = TRUE
  PREMISE_NETS_OWN_LEGS     = FALSE
  PREMISE_SUPERSESSION_FAIR = TRUE
INVARIANTS
  TypeOK
  INV10_PremiseSupersessionOnlyOnRealLoss
