\* NEGATIVE CONTROL NC1 -- the interval floor sized from the WORST-magnitude
\* endpoint max(|a|,|b|) instead of the endpoint nearest zero. EXPECTED:
\* INV1_NeverOvershootSign VIOLATED -- reducing by the far endpoint crosses
\* into the opposite sign under some resolution. This reproduces the sign
\* asymmetry the SPEC ITSELF carried: v0.7.1's "|b|" was correct only for
\* the net-LONG case (R1d-2). It is also the run that proves INV1 is not
\* reading the endpoint formula: an invariant phrased over the formula
\* would flip with the constant and pass here.
SPECIFICATION Spec
CONSTANTS
  NORD                    = 3
  MAXQ                    = 2
  NPEND                    = 3
  MAX_DISPATCH            = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO      = FALSE
  FLOOR_ONCE              = TRUE
  STRADDLE_GUARD          = TRUE
  BLIND_COMPENSATION      = FALSE
  CLASSIFY_ON_FILLS_ONLY  = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  \* SLICE C liveness controls, at their nominal values (NC13-NC16 flip one
  \* each). None is read by a guard a safety invariant can see.
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
  RECLASSIFY_ON_LEDGER_CHANGE = TRUE
INVARIANTS
  TypeOK
  INV1_NeverOvershootSign
