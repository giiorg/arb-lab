\* NEGATIVE CONTROL NC1 -- the interval floor sized from the WORST-magnitude
\* endpoint max(|a|,|b|) instead of the endpoint nearest zero. EXPECTED:
\* INV1_NeverOvershootSign VIOLATED -- reducing by the far endpoint crosses
\* into the opposite sign under some resolution. This reproduces the sign
\* asymmetry the SPEC ITSELF carried: v0.7.1's "|b|" was correct only for
