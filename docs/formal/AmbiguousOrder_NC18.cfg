\* NEGATIVE CONTROL NC18 -- P5. HELD_RESUMES = FALSE, exactly NC15's constant
\* flip, with P5 listed alone instead of P3.
\*
\* It is deliberately the SAME constant as NC15 and it is NOT a duplicate.
\* FLAG-4's ruling is about the STATE Held/Alert, which SM SS7 enters from
\* either leg, so the constant that removes the resume edge removes it from
\* BOTH parks. What NC15 shows is that P3 bites; what this shows is that P5
\* bites. SS46 SS4's rule -- "every liveness property ships with its negative
\* control in the same slice" -- is a rule about PROPERTIES, not about
\* constants, because Cx8 proved a passing liveness property and a vacuous
\* one look identical. A P5 that had never been seen to fail would be exactly
\* that unknown, and the fact that its sibling P3 fails under the same flip
\* is an argument, not evidence.
\*
\* `failprop` cannot name which property TLC violated, so this config lists
\* exactly ONE -- the NC5 discipline. That is the whole reason it is a
\* separate file rather than a second property line in NC15.
SPECIFICATION LiveSpec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = FALSE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
  RECLASSIFY_ON_LEDGER_CHANGE = TRUE
  \* SLICE F -- FM-8's standing precondition and the quantity it reads.
  PREMISE_IS_STANDING       = TRUE
  PREMISE_NETS_OWN_LEGS     = TRUE
  PREMISE_SUPERSESSION_FAIR = TRUE
INVARIANTS
  TypeOK
PROPERTIES
  P5_HeldPerpGenerationResumes
