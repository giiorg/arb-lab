\* CONTROL-WITNESS PROBE W2 -- does NC13's counterexample show the HARM?
\*
\* NC13's trace ends in a stuttering state with `budget = 0`. There the
\* machine could not have compensated the residual even with a PERFECT
\* classifier, so that witness demonstrates the STALL -- which is all P1
\* claims -- while saying nothing about what the stall costs. The mirror of
\* NC12's zero-amount orphan, one model apart.
\*
\* So this asks the harm question directly, under NC13's own constants:
\* is the machine reachable in a state where every interval has collapsed,
\* no generation is running, the residual is NONZERO, the dispatch budget is
\* still there -- and the verdict is stuck at something other than
\* `Determined`, so the compensating trade it could still afford is barred
\* forever by a verdict nobody will revisit? A VIOLATION is the good result.
\*
\* CHECK_DEADLOCK FALSE: same reason as NC13's own config -- a stranded
\* machine is the point, and the deadlock would be reported before the
\* invariant.
\* SPECIFICATION Spec, not LiveSpec: this is a REACHABILITY question, and
\* fairness constrains which behaviours count, never which states exist.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  RECLASSIFY_ON_FINALITY    = FALSE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
INVARIANTS
  NoStrandedNakedResidual
