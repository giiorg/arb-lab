\* CONTROL-WITNESS PROBE W4 -- does NC16's counterexample show the HARM?
\*
\* NC16's lasso cycles at `budget = 0`, the same place NC13's stutters, and
\* for the same reason: TLC's counterexample search finds the deep states.
\* A reservation stuck in the blind-retry loop costs nothing if nothing will
\* ever size against it again -- so the trace proves P4 bites while leaving
\* the cost unstated.
\*
\* This asks the cost directly, under NC16's own constants: can the machine
\* be ABOUT TO SIZE a compensating trade -- `Determined`, budget left, a free
\* generation slot, a nonzero residual -- while a floor generation caught in
\* the retry loop is contributing a nonzero term to the very subtraction it
\* will size from? That trade comes out short by exactly the amount of a
\* reduction that is never going to land. A VIOLATION is the good result.
\*
\* Not needed for NC15: that control's own witness is already harmful on its
\* face -- a generation parked in `Held` forever with an ACTIVE pkgspot
\* reservation of 1, `pdDone = 1`, `pdSold = 0` and `budget = 1` left. The
\* question was asked of all four controls; three needed a probe to answer
\* it, one answered it in its own trace.
\* SPECIFICATION Spec, not LiveSpec: a REACHABILITY question.
SPECIFICATION Spec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = TRUE
INVARIANTS
  NoStuckFloorSubtrahend
