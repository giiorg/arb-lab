\* SLICE F -- the FIX'S OWN JUSTIFICATION, as a checked property.
\*
\* `FM-9`'s resolution says the standing trigger must read the premise NET OF
\* THE GENERATION'S OWN LEGS, and the reason that quantity is the right one is
\* that THE GENERATION CANNOT MOVE IT. That claim is load-bearing: if it were
\* false the trigger would fire on the generation's own behaviour a second
\* time and the finding would be mis-diagnosed.
\*
\* It appears as an ARGUMENT in SM SS7, in the companion artifact and in the
\* design record. `FM-7` is this repo's evidence for what happens to an
\* argument nobody re-derives, so it is checked here instead.
\*
\* EXPECTED: PASS. Nominal constants throughout -- this is a claim about the
\* MODEL'S OWN ARITHMETIC, so a control that broke some other rule would not
\* be evidence about it.
\*
\* Non-vacuity costs no run: every action in `PdOwnStep` is already shown
\* REACHED by an existing positive control (PC13, PC14, PC15, PC18, PC20,
\* PC21, PC25).
\*
\* SPECIFICATION Spec, not LiveSpec: an ACTION property, not a temporal one --
\* it constrains every step, so no fairness premise is involved.
SPECIFICATION Spec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  \* SLICE C liveness controls, at their nominal values (NC13-NC16 flip one
  \* each). None is read by a guard a safety invariant can see.
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
  RECLASSIFY_ON_LEDGER_CHANGE = TRUE
  \* SLICE F -- FM-8's standing precondition and the quantity it reads.
  PREMISE_IS_STANDING       = TRUE
  PREMISE_NETS_OWN_LEGS     = TRUE
  PREMISE_SUPERSESSION_FAIR = TRUE
PROPERTIES
  P6_GenerationCannotMoveItsOwnPremise
