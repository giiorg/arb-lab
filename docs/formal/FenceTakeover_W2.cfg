\* CONTROL-WITNESS PROBE W2 -- does NC2's counterexample show the HARM?
\*
\* NC2 claims "false 'flat' on a zero-fill close / premature tombstone WITH
\* OPEN EXPOSURE". Its witness is 4 states -- replicate, entry submit,
\* deactivate -- and tombstones a package that is FLAT and has never held
\* exposure; I3 fires on its `NoLiveOrders` conjunct alone. Worse than
\* degenerate: it takes BotDeactivate's `pos = "flat"` disjunct, so the
\* ISSUANCE-GATED mechanism the control is named for (tombstone as soon as
\* the close is merely issued -- the `botCloseLive` disjunct) is never
\* exercised.
\*
\* This asks for the claimed state directly. Under EVIDENCE_GATED = FALSE
\* it is reachable only through the `botCloseLive` disjunct, so a violation
\* demonstrates the mechanism AND the harm in one trace.
\*
\* It also settles a SUITE defect. `plan = "tombstone" /\ pos # "flat"` is
\* exactly an I2_HostIndependentCoverage violation, and I2 has never been
\* violated by any run in this suite -- it is listed only here and in NC4,
\* and both halt on a shallower I3. If W2 is reached, I2 bites and only
\* TLC's search order hid it.
