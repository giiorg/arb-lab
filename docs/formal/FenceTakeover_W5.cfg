\* CONTROL-WITNESS PROBE W5 -- does NC5's counterexample show the HARM?
\*
\* NC5 is the one that already answers the question in its own trace, and
\* it is worth recording as the positive case rather than assuming it: the
\* lasso sits at `fenceCtl = "lost"`, `branchMax = 0`, `incidentActive`,
\* `pos = "neutral"`, `hadExposure = TRUE`. The config's claim -- "the
\* incident strands in un-arbitrated FenceReadyLost with exposure open" --
\* is verified by the witness, not merely asserted beside it.
\*
\* The residual question is the one NC13/NC16 raised in model (a): TLC
\* reports A counterexample, so is the WORST version reachable? A stranded
\* NEUTRAL package is hedged and bleeding funding. A stranded NAKED one is
\* directional and unbounded, and it is precisely the state SM SS3's
\* arbitration exists to get out of.
\*
\* SPECIFICATION Spec, not LiveSpec2: this is a REACHABILITY question, and
\* fairness constrains which behaviours count, never which states exist
\* (model (a)'s W2 precedent). LIMIT, stated because the probe cannot close
\* it -- reaching the naked un-arbitrated state is NECESSARY but not
\* SUFFICIENT for a naked strand. A violation says the harmful state
\* exists; it does not say NC5's lasso can sit there.
