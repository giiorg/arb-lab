\* NEGATIVE CONTROL NC11 -- a reservation SURVIVES its own counterpart's
\* finality, so `outstanding_reserved_reductions` keeps subtracting a
\* reduction that already happened.
\* EXPECTED: INV4_ReservationLedgerSound VIOLATED -- SS46 SS4's "no naked
\* residual is masked by a reservation that has already COMPLETED".
\*
\* This is the control that forced the Impl/True split down into the ledger:
\* ImplReserved counts the stale entry (it is what the sizing reads),
\* TrueReserved does not, so the invariants' own inputs stay honest while
\* the implementation's are corrupted.
SPECIFICATION Spec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = FALSE
  RELEASE_ON_SUPERSEDE     = TRUE
INVARIANTS
  TypeOK
  INV4_ReservationLedgerSound
