\* NEGATIVE CONTROL NC19 -- `FM-6`. RECLASSIFY_ON_LEDGER_CHANGE = FALSE:
\* SS2's classification rides on ORDER events only, which is the literal
\* reading of SS2 and exactly what slices A-D modeled.
\*
\* ITS SIGNATURE IS A DEADLOCK, and that is the honest report rather than a
\* weaker one. The state TLC stops at has NO successors at all:
\*
\*   - every counter-leg interval has COLLAPSED (all orders q = 0), so the
\*     residual is determined in SS2's own sense -- "no exposure-changing
\*     order has any remaining executable or unobserved quantity";
\*   - the verdict is still `DeadlineExceeded`, because the last event that
\*     could have re-run the classifier was an ORDER event and the
\*     generation's end is not one;
\*   - that verdict admits exactly one action, the interval floor, and
\*     FLOOR_ONCE has already spent it;
\*   - `IssueExposureReduction` needs `Determined`, `PdPlan` needs
\*     `Determined` AND a zero residual, and `Settled` needs a zero residual
\*     or a spent budget -- the residual is NONZERO and the budget is NOT
\*     spent.
\*
\* So: a determined naked residual, dispatch budget in hand, and nothing
\* enabled. The package holds with an alert and no admissible action, for
\* ever, because a verdict went stale.
\*
\* WHY NO EARLIER SLICE COULD SEE IT. Every other path out of a generation
\* runs through PdPerpFinal, which reclassifies. The PERP-SIDE PARK -- SM
\* SS7's own transition row, unmodeled until slice E (SS46 SS10a) -- is the
\* UNIQUE route that leaves a generation without it. That is why this
\* control's subject had to be built before its defect could exist: the
\* deadlock is not caused by the park, it is REVEALED by it.
\*
\* Verified as the cause, not merely correlated: with `PdPerpHolds` removed
\* from Next and every other slice-E edit in place, the nominal
\* configuration reproduces the recorded pre-slice-E state graph to the
\* digit (6,729,250 generated / 832,179 distinct) -- so nothing else added
\* here changes the reachable set.
