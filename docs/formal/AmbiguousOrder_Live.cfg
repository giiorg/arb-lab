\* NOMINAL LIVENESS configuration for formal model (a), slice C: the four
\* temporal properties of SS46 SS4, checked under LiveSpec (= Spec + the
\* fairness set argued line-by-line in AmbiguousOrder.tla).
\*
\* Same constants as the nominal SAFETY config, so this is the SAME state
\* graph with a fairness assumption on top -- fairness constrains which
\* BEHAVIOURS count, never which states are reachable. That is what lets the
\* twenty-four positive controls, which run against the safety config, stand
\* as the non-vacuity evidence for these four properties' antecedents:
\* PC22 (Ambiguous) for P1, PC23 (DeadlineExceeded) for P2, PC14 (Held) for
\* P3, PC24 (a floor generation outstanding) for P4.
\*
\* The safety invariants are listed too. They are redundant here in the
\* strict sense -- the graph is the one AmbiguousOrder.cfg already checked --
\* and they are kept for the same reason model (b)'s liveness config keeps
\* its own: a config that checks a spec under a DIFFERENT specification
\* formula should say what it expects of that formula in full, so a future
\* edit to LiveSpec cannot quietly change the object being checked while
\* only the temporal properties are being read.
\*
\* Tractability: run.sh checks liveness with `-lncheck final` (one pass over
\* the completed graph).
SPECIFICATION LiveSpec
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
INVARIANTS
  TypeOK
  INV1_NeverOvershootSign
  INV2_FloorIssuedAtMostOnce
  INV3_NoUncertainCompensation
  INV7_DeterminedIsReallyDetermined
  INV4_ReservationLedgerSound
  INV5_PackageDeleverNeverNetShort
  INV6_SupersessionQuiescesFirst
PROPERTIES
  P1_AmbiguousEventuallyClassified
  P2_DeadlineExceededResolves
  P3_HeldGenerationResumes
  P4_FloorGenerationResolves
