\* CONTROL-WITNESS PROBE W3 -- does NC3's counterexample show the HARM?
\*
\* NC3 is the one control that CANNOT have a degenerate witness in the
\* exposure dimension, and not by luck: ActCanaryUnfencedClose carries
\* `pos # "flat"` in its own guard, so every witness of it has exposure.
\* (Its committed one has `pos = "neutral"`, `hadExposure = TRUE`, an
\* actuator close in flight.) A control whose harmful precondition is a
\* GUARD of the action it enables is degenerate-proof in that dimension --
\* worth stating, because it is the property the other three lack.
\*
\* So the open half is the OTHER one. SS7.4's tier rationale says the
\* canary regime "claims no single-writer safety", and NC3's witness has
\* actLandedUnfenced alone -- an un-latched actuator write, which is one
\* writer misbehaving, not two writers. The strongest form of the claim is
\* both of I1's conjuncts true in one behaviour.
\*
\* A PASS here would be a finding, not a nothing: it would mean the canary
\* regime, in this model, never actually produces two landed writers, and
\* the tier rationale is stronger than what NC3 can demonstrate.
SPECIFICATION Spec
CONSTANTS
  DURABLE_LATCH      = TRUE
  EVIDENCE_GATED     = TRUE
  CANARY_UNFENCED    = TRUE
  TRADE_TERMINALITY  = TRUE
  OPERATOR_INTERVENES = TRUE
  ARBITRATION_SNAPSHOT = TRUE
  MAX_CLOSE_ATTEMPTS = 2
  BOUND_CRASHES      = FALSE
  CRASH_BUDGET       = 0
INVARIANTS
  W3_NoTwoWritersBothLanded
