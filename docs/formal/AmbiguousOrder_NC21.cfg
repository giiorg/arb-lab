\* NEGATIVE CONTROL NC21 -- `FM-8`, and it is the PRE-RULING WORLD rather
\* than an invented defect. PREMISE_IS_STANDING = FALSE: "the package has no
\* naked residual" is an ENTRY GUARD alone, evaluated once by PdPlan and
\* never again. That is precisely how slices A-E modeled SS7, and how SS7
\* read before v0.9.25.
\*
\* EXPECTED: INV9_GenerationNeverAdvancesOnLostPremise VIOLATED -- the
\* machine takes a generation FURTHER (submits a leg, authorizes a sale)
\* after the premise it opened under has dissolved underneath it.
\*
\* This is the run that says the hole `PC28` found is CLOSED by the ruling
\* and not by something else in the model: the constant is the ruling, and
\* nothing else differs from the nominal configuration.
\*
\* PC28 is its witness and stays a POSITIVE control rather than being flipped
\* into an invariant. The reason is SS7's own quiesce obligation: the
\* dissolved state is REACHABLE and LEGAL for as long as the reserved second
\* leg takes to reach SS6.7 finality, so `PdActive => PremiseIntact` would
\* forbid the window the spec mandates. The harm is an EVENT in that window,
\* which is why INV9 reads a flag -- the same shape as INV6 one row up.
