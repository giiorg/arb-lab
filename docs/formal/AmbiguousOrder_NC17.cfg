\* NEGATIVE CONTROL NC17 -- INV8. HELD_EXIT_CAUSE_BLIND = TRUE: the exit from
\* a park is CAUSE-BLIND, so the reserved SPOT leg's finality barrier also
\* discharges a park whose PERP leg is the unresolved one.
\*
\* This is model (b)'s Cx8-2 recreated deliberately in model (a), and it is
\* the first time model (a) has been asked the question. Cx8-2: "HeldIncident
\* is two states wearing one name -- SM SS4 gives the readiness park and the
\* budget-exhaustion park DIFFERENT exits, and ActHeldReentry's cause-blind
\* guard exited both." SM SS7 has exactly the same shape: Held/Alert is
\* entered from `PerpReduceInFlight` OR `SpotReduceInFlight`, and FLAG-4's
\* exit is "eventual finality of THE HELD LEG resumes the remaining target"
\* -- the held leg, not any leg. Slices A-D modeled only the spot-side park
\* (SS46 SS10a), so the mirror was unreachable and therefore unchecked.
\*
\* Why the bad edge is REACHABLE rather than absurd: FLAG-3 puts the
\* "pkgspot" ledger entry in existence FROM CREATION, so PdPendIds is
\* nonempty at HeldPerp and PdSpotFinal's guard passes. Under the nominal
\* (post-FM-5) reading its amount is the generation's outstanding net intent,
\* which a PARTIALLY FILLED perp leg has already amended upward -- so the
\* cause-blind exit does not merely mislabel a state, it EXECUTES a spot sale
\* against a reservation whose counterpart reduction is still live.
\*
\* Predicted violation: INV8_CompleteMeansLegsFinal. The generation reaches
\* `Complete` -- SM SS7's "the generation has reached SS6.7 finality; only now
\* is a next generation admissible" -- with pdPerp > 0, i.e. with executable
\* perp quantity outstanding that the next generation's sizing cannot see.
\*
\* ISOLATION (the "a probe two gates can see" rule): NC9 (PERP_FIRST = FALSE)
\* also produces a spot sale with no confirmed perp reduction, so an
\* invariant phrased over the AUTHORIZATION record would be violated by both
\* and would show that something objected rather than that THIS rule did.
\* INV8 stays green under NC9 -- there the perp leg was never submitted, so
\* pdPerp is 0 -- and is violated only by a park exited through the wrong
\* leg's barrier.
