\* NEGATIVE CONTROL NC13 -- P1. RECLASSIFY_ON_FINALITY = FALSE: the machine
\* re-runs classification on fill/position events only, dropping the second
\* half of SM SS2 Scope's clause ("...AND every hedge-group order-lifecycle/
\* finality event"). An interval that collapses WITHOUT executing -- a
\* cancel confirmed with zero executions, the case PC8 shows is reached --
\* then leaves the verdict STALE-AMBIGUOUS: the residual is determined and
\* the machine never says so, so no compensating trade is ever admissible
\* and the position sits naked behind a verdict nobody will revisit.
\*
\* This is the LIVENESS half of "the machine MUST NOT wait for the next
\* fill". SS46 SS7e split the clause deliberately: the SAFETY half is a
\* classifier that reads fills alone and OVERSHOOTS (INV7, NC4); this half
\* STALLS, and no invariant in the module can see a stall.
\*
\* It fails P2 as well, and that is expected rather than a defect in the
\* control: removing the finality edge stops re-classification for EVERY
\* verdict. NC14 is the narrower control that isolates P2. P1 is the only
\* property listed here, so the reported temporal violation is attributable.
\*
\* CHECK_DEADLOCK FALSE, and the reason is specific to this control: a
\* machine frozen in `Ambiguous` with every interval collapsed and budget
\* left has no enabled action at all (the determined branch is gated on the
\* verdict; `Settled` needs a zero residual or a spent budget), so TLC would
\* report the stall as a DEADLOCK during state generation and never reach
\* the liveness pass. The deadlock check is a claim about the NOMINAL model
\* -- it predicts exactly one terminal -- and stranding the machine is what
\* this config is for. It stays ON in NC15/NC16, where nothing is stranded.
SPECIFICATION LiveSpec
CHECK_DEADLOCK FALSE
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  RECLASSIFY_ON_FINALITY    = FALSE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
  RECLASSIFY_ON_LEDGER_CHANGE = TRUE
  \* SLICE F -- FM-8's standing precondition and the quantity it reads.
  PREMISE_IS_STANDING       = TRUE
  PREMISE_NETS_OWN_LEGS     = TRUE
  PREMISE_SUPERSESSION_FAIR = TRUE
INVARIANTS
  TypeOK
PROPERTIES
  P1_AmbiguousEventuallyClassified
