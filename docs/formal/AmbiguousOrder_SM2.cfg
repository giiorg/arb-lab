\* SS2-ONLY configuration: MAX_GEN = 0 disables SS7's PackageDelever
\* generations entirely, so this is SLICE A's model with slice B's ledger.
\*
\* It exists to keep INV1's PERSISTENT conjunct (INV1b) checked. That
\* conjunct's justification is a small theorem about the slice-A event set,
\* and SS46 SS7e's stated bound -- "no new counter-leg order appears
\* mid-episode" -- is its premise. SS7's perp reduce breaks that premise
\* legitimately, so INV1b belongs HERE rather than in the composed run: not
\* weakened, checked where it holds. Its bite is not decorative -- SS46 SS7a
\* measured that it catches NC1 and NC6 on its own.
\*
\* Running it also reproduces slice A's recorded state graph under the new
\* module, which is the same evidence model (b) supplies by reproducing its
\* v0.9.4 counts to the digit: it says the refactor did not quietly change
\* the object slice A verified.
