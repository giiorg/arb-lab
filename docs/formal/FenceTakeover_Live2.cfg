\* Automated-convergence LIVENESS configuration [-> Cx6-5]: the operator
\* cannot rescue a stalled branch (OPERATOR_INTERVENES = FALSE); fills are
\* strongly fair. Checks the SS9 branch-1/2 composite-guarantee shape:
\* automated flat or an honest escalation terminal, no silent stall.
\* Same tractability setup as _Live.cfg (run.sh `-lncheck final` + the WF
\* arbitration fairness); full CRASH_BUDGET = 2 scope.
SPECIFICATION LiveSpec2
CONSTANTS
  DURABLE_LATCH      = TRUE
  EVIDENCE_GATED     = TRUE
  CANARY_UNFENCED    = FALSE
  TRADE_TERMINALITY  = TRUE
  OPERATOR_INTERVENES = FALSE
  MAX_CLOSE_ATTEMPTS = 2
  BOUND_CRASHES      = TRUE
  CRASH_BUDGET       = 2
INVARIANTS
  TypeOK
  I1_NeverTwoWriters
  I2_HostIndependentCoverage
  I3_EvidenceGatedTerminal
  I4_LeaseTombstone
  I6_HeldHonest
  I7_EscalateOnly
PROPERTIES
  \* Split per branch [-> Cx7-2]: the combined property was vacuous for
  \* branch 1 (the stand-down disjunct holds on entry to every wind-down),
  \* so the Cx6-5 check only ever exercised branch 2. Listed separately so
  \* a violation names the branch. (Branch12AutoResolves in the module is
  \* the named conjunction of these two.)
  Branch1AutoResolves
  Branch2AutoResolves
  \* FM-3 regression: the branch-2 stall is not a terminal state.
  P2_NoBranch2Stall
