\* Nominal LIVENESS configuration: fairness + crash budget (liveness is
\* claimed for behaviors with finitely many crashes; the SAFETY configs
\* keep crashes unbounded). Tractability (Cx6 close-out): checked with
\* run.sh's `-lncheck final` (one liveness pass over the completed graph
\* -- TLC's default periodic passes made this config >1 h) and the WF
\* arbitration fairness (SF retained only where load-bearing: the latch
\* phase-alternation + the operator windows -- see the Fairness comments).
\* ~6 min on 18 cores.
SPECIFICATION LiveSpec
CONSTANTS
  DURABLE_LATCH      = TRUE
  EVIDENCE_GATED     = TRUE
  CANARY_UNFENCED    = FALSE
  TRADE_TERMINALITY  = TRUE
  OPERATOR_INTERVENES = TRUE
  ARBITRATION_SNAPSHOT = TRUE
  MAX_CLOSE_ATTEMPTS = 2
  BOUND_CRASHES      = TRUE
  CRASH_BUDGET       = 2
INVARIANTS
  TypeOK
  I1_NeverTwoWriters
  I2_HostIndependentCoverage
  I3_EvidenceGatedTerminal
  I4_LeaseTombstone
  I6_HeldHonest
  I7_EscalateOnly
PROPERTIES
  IncidentResolves
