\* Nominal LIVENESS configuration: fairness + crash budget (liveness is
\* claimed for behaviors with finitely many crashes).
SPECIFICATION LiveSpec
CONSTANTS
  DURABLE_LATCH      = TRUE
  EVIDENCE_GATED     = TRUE
  CANARY_UNFENCED    = FALSE
  TRADE_TERMINALITY  = TRUE
  MAX_CLOSE_ATTEMPTS = 2
  BOUND_CRASHES      = TRUE
  CRASH_BUDGET       = 2
INVARIANTS
  TypeOK
  I1_NeverTwoWriters
  I2_HostIndependentCoverage
  I3_EvidenceGatedTerminal
  I4_LeaseTombstone
  I6_HeldHonest
  I7_EscalateOnly
PROPERTIES
  IncidentResolves
