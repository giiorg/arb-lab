\* CONTROL-WITNESS PROBE W3 -- the same harm question asked of NC14.
\*
\* W2's mirror, one control over: NC14 latches the deadline-exceeded verdict
\* instead of removing the finality edge, so the two controls strand the
\* machine in DIFFERENT verdicts -- `Ambiguous` for NC13, `DeadlineExceeded`
\* for NC14 -- and one shared invariant (`cls # "Determined"`) covers both.
\* Running it against both sets of constants rather than assuming NC13's
\* answer transfers is the point: the two configs prune the state graph
\* differently (930,385 distinct states vs 460,997), and "the harmful state
\* is reachable over there" is not evidence that it is reachable here.
\* SPECIFICATION Spec, not LiveSpec: this is a REACHABILITY question, and
\* fairness constrains which behaviours count, never which states exist.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = FALSE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
INVARIANTS
  NoStrandedNakedResidual
