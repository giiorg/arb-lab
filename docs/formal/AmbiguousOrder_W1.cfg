\* CONTROL-WITNESS PROBE W1 -- does NC12's counterexample show the HARM?
\*
\* It runs NC12's constants (RELEASE_ON_SUPERSEDE = FALSE) and checks ONE
\* claim, phrased as the good outcome so a VIOLATION is the good result: the
\* orphaned pkgspot entry can carry a NONZERO amount. TLC reports the
\* SHORTEST counterexample, and for INV4's orphan clause that is an entry of
\* amount ZERO -- which leaks a ledger slot but subtracts nothing, so NC12
\* would demonstrate the leak while saying nothing about the harm. This is
\* the fixture-collapse question aimed at a CONTROL'S EVIDENCE rather than at
\* a fixture, and SS46 SS8b asked it by hand in session 66. It is a committed
\* run now for the reason CLAUDE.md gives: a check applied in one place gets
\* applied to its mirror, and the mirrors are W2/W3.
\*
\* CHECK_DEADLOCK FALSE: with the orphan un-releasable, `Settled` (which
\* requires an empty ledger) is permanently unreachable and TLC would report
\* the deadlock instead of the invariant -- a real signature of the same
\* defect, recorded in SS46 SS8b, but not the question this config asks.
\* SPECIFICATION Spec, not LiveSpec: this is a REACHABILITY question, and
\* fairness constrains which behaviours count, never which states exist.
SPECIFICATION Spec
CHECK_DEADLOCK FALSE
CONSTANTS
  NORD                     = 3
  MAXQ                     = 2
  NPEND                    = 3
  MAX_DISPATCH             = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO       = TRUE
  FLOOR_ONCE               = TRUE
  STRADDLE_GUARD           = TRUE
  BLIND_COMPENSATION       = FALSE
  CLASSIFY_ON_FILLS_ONLY   = FALSE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = FALSE
  \* SLICE C liveness controls, at their nominal values (NC13-NC16 flip one
  \* each). None is read by a guard a safety invariant can see.
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
INVARIANTS
  NoNonzeroOrphan
