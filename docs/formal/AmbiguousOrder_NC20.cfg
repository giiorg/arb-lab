\* NEGATIVE CONTROL NC20 [SLICE E item 3] -- does "never issued twice" carry
\* SAFETY weight independent of the reservation?
\*
\* SM SS2's interval-floor rule says the floor is "never issued twice (else,
\* for [0.4, 1.0], two uncertain 0.4 reductions could reach -0.4 and defeat
\* the proof)". SS46 SS7d flagged that the stated justification assumes the
\* reservation is NOT counted -- which the adjacent sentence requires it to
\* be -- and reported that NC2's counterexample leaves `overshoot` FALSE
\* throughout, i.e. the flat rule looked like belt-and-braces over the
\* reservation rather than an independent property.
\*
\* THAT READING WAS TAKEN OFF A TRUNCATED SEARCH, which slice E item 2 found
\* the same way one model over. NC2 lists TypeOK and INV2 only, and INV2 is
\* `floorCount <= 1` -- so TLC HALTS at the first second-dispatch state and
\* explores nothing beyond it. `overshoot` was not merely FALSE there; it was
\* never a checked invariant in that run at all. "No overshoot was reported"
\* and "no overshoot exists" are different claims, and only the second one
\* answers SS7d.
\*
\* So: NC2's constants exactly, with INV2 REMOVED and INV1 listed alone. The
\* search now runs the whole FLOOR_ONCE = FALSE space and asks whether double
\* issuance can overshoot the sign WHILE reservation-aware sizing is working.
\*
\* NON-VACUITY IS ALREADY ESTABLISHED AND COSTS NO RUN: INV2 is exactly
\* `floorCount <= 1`, so NC2 violating it IS the proof that the
\* double-issuance state is reached under these same constants. A pass here
\* is therefore a real answer and not an unreached branch.
\*
\* PREDICTION: PASS -- SS7d's reading survives a full search, and the rule is
\* defence-in-depth over the reservation rather than an independent safety
\* property ON THIS MODEL. A pass is NOT licence to weaken the spec (SS46
\* SS11's docket says so explicitly); it makes the spec owe a REASON, since a
\* rule whose stated justification assumes something the neighbouring
\* sentence forbids is under-argued even when the rule itself is right.
\* A VIOLATION is the cleaner outcome: the rule carries independent weight
\* and the spec is right as written.
\*
\* INV1 alone, deliberately: an invariant listed beside it could halt the
\* search first and reproduce the exact defect this control exists to correct.
SPECIFICATION Spec
