\* NEGATIVE CONTROL NC4 -- the classifier reads the FILL LEDGER ALONE, so an
\* order with remaining executable quantity that has never been observed
\* executing (SubmissionUnknown / Acknowledged with zero fills) is invisible
\* to it. EXPECTED: INV7_DeterminedIsReallyDetermined VIOLATED -- the
\* residual is reported Determined while unobserved quantity remains.
\* SM SS2's `Determined` says "no remaining executable OR UNOBSERVED
\* quantity"; this run is what makes that second disjunct load-bearing.
SPECIFICATION Spec
CONSTANTS
  NORD                    = 3
  MAXQ                    = 2
  NPEND                    = 3
  MAX_DISPATCH            = 3
  MAX_GEN                  = 2
  FLOOR_NEAREST_ZERO      = TRUE
  FLOOR_ONCE              = TRUE
  STRADDLE_GUARD          = TRUE
  BLIND_COMPENSATION      = FALSE
  CLASSIFY_ON_FILLS_ONLY  = TRUE
  RESERVATION_AWARE_SIZING = TRUE
  RESERVE_AT_CREATION      = FALSE
  SPOT_CAPPED_BY_PERP      = TRUE
  PERP_FIRST               = TRUE
  QUIESCE_BEFORE_SUPERSEDE = TRUE
  RELEASE_ON_FINALITY      = TRUE
  RELEASE_ON_SUPERSEDE     = TRUE
  \* SLICE C liveness controls, at their nominal values (NC13-NC16 flip one
  \* each). None is read by a guard a safety invariant can see.
  RECLASSIFY_ON_FINALITY    = TRUE
  RECLASSIFY_AFTER_DEADLINE = TRUE
  HELD_RESUMES              = TRUE
  BLIND_RETRY               = FALSE
  HELD_EXIT_CAUSE_BLIND     = FALSE
  RECLASSIFY_ON_LEDGER_CHANGE = TRUE
  \* SLICE F -- FM-8's standing precondition and the quantity it reads.
  PREMISE_IS_STANDING       = TRUE
  PREMISE_NETS_OWN_LEGS     = TRUE
  PREMISE_SUPERSESSION_FAIR = TRUE
INVARIANTS
  TypeOK
  INV7_DeterminedIsReallyDetermined
